
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Entrar | Vitrine</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="pagina-form">

    <a class="marca" href="/">
        Vitrine<span>.</span>
    </a>

    <form id="loginForm" class="form-card">

        <p class="sobretitulo">
            BEM-VINDO DE VOLTA
        </p>

        <h1>Entrar na conta</h1>

        <label>
            E-mail
            <input
                id="email"
                type="email"
                autocomplete="email"
                required>
        </label>

        <label>
            Senha
            <input
                id="senha"
                type="password"
                autocomplete="current-password"
                required>
        </label>

        <button type="submit" class="btn btn-full">
            Entrar
        </button>

        <p id="mensagem" class="mensagem" role="status"></p>

        <p>
            Não tem conta?
            <a href="/cadastro.html">Cadastre-se</a>
        </p>

        <p>
            <a href="/">Voltar para a loja</a>
        </p>

    </form>

    <script src="/js/auth.js"></script>
    <script src="/js/nav.js"></script>

</body>
</html>
